name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Release build smoke test
        run: |
          mkdir -p dist-smoke
          cmd_pkg="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./cmd/... | sed '/^$/d' | head -n1)"
          if [ -z "${cmd_pkg}" ]; then
            echo "No main package found under ./cmd"
            exit 1
          fi
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "${goos}" = "windows" ]; then
              ext=".exe"
            fi
            out="dist-smoke/cfgstack_${goos}_${goarch}${ext}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-X github.com/etherinus/cfgstack/internal/buildinfo.Version=ci-smoke -X github.com/etherinus/cfgstack/internal/buildinfo.Commit=ci -X github.com/etherinus/cfgstack/internal/buildinfo.Date=ci" \
              -o "${out}" "${cmd_pkg}"
          done
